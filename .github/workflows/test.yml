name: test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Keep in step with the Dockerfile's node:<major>-alpine stages, so
          # CI exercises the runtime the image actually ships.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # c8 wraps cucumber-js, so this is the same suite as `npm test` plus
      # coverage of the compiled dist/ (mapped back to src/ via source maps).
      - name: Run Cucumber tests with coverage
        run: npm run test-coverage

      - name: Coverage summary
        if: always() && hashFiles('coverage/lcov.info') != ''
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx --no-install c8 report --reporter=text >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
