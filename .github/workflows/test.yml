name: test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Keep in step with the Dockerfile's node:<major>-alpine stages, so
          # CI exercises the runtime the image actually ships.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cucumber tests
        run: npm test
