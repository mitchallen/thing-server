version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Monthly: security updates bypass the schedule and still open as soon as
    # an alert fires, so this only slows routine version bumps.
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    # @types/node minor/patch bumps were most of the weekly PR noise and
    # rarely matter here. Majors still come through, and track the Node
    # major the image runs on.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      # Production deps are what actually ships in the image, so their majors
      # stay ungrouped and get reviewed one at a time. Minor/patch are routine.
      prod-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

      # Dev deps never reach the runtime image (the Dockerfile installs with
      # --omit=dev), so their minor/patch churn is grouped too. Majors are
      # NOT grouped: "development" includes the TypeScript compiler, and a
      # compiler major changes what the build enforces and what it emits. TS 6
      # silently flipped `strict` on by default and broke the build (#69); that
      # deserves its own PR, not a line item in a three-package bump (#74).
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    # The image tracks Node LTS lines only (the node:<major>-alpine stages in
    # the Dockerfile). Odd majors never become LTS and are EOL within months,
    # so skip them; even majors (26, 28, ...) still come through as their own
    # PR. Dependabot has no "odd majors" matcher, so each is listed — extend
    # this before 33 ships.
    ignore:
      - dependency-name: "node"
        versions:
          - ">= 25, < 26"
          - ">= 27, < 28"
          - ">= 29, < 30"
          - ">= 31, < 32"

  # Keeps the workflows' actions (checkout, setup-node, upload-artifact, the
  # docker/* publish actions) current. Monthly, like the other ecosystems.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
