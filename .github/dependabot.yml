version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Production deps are what actually ships in the image, so their majors
      # stay ungrouped and get reviewed one at a time. Minor/patch are routine.
      prod-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

      # Dev deps never reach the runtime image (the Dockerfile installs with
      # --omit=dev), so their minor/patch churn is grouped too. Majors are
      # NOT grouped: "development" includes the TypeScript compiler, and a
      # compiler major changes what the build enforces and what it emits. TS 6
      # silently flipped `strict` on by default and broke the build (#69); that
      # deserves its own PR, not a line item in a three-package bump (#74).
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
